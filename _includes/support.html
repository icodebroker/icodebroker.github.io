{%- assign t = site.data.i18n[page.lang] -%}
<aside class="tip support">
  <span class="tip-emoji" aria-hidden="true">☕</span>
  <div class="support-body">
    <h2>{{ t.support_title }}</h2>
    <p>{{ t.support_text }}</p>
  </div>
  <div class="support-links">
    <a class="btn btn-coffee" href="https://buymeacoffee.com/icodebroker" target="_blank" rel="noopener">Buy Me a Coffee</a>
    <a class="btn btn-kakaopay" href="https://qr.kakaopay.com/FY5ckSnAl9c401936" target="_blank" rel="noopener">{{ t.support_kakaopay }}</a>
    <figure class="kakaopay-qr">
      <img src="{{ '/assets/kakaopay-qr.svg' | relative_url }}" width="112" height="112" alt="{{ t.support_kakaopay }} QR">
      <figcaption>{{ t.support_kakaopay_qr }}</figcaption>
    </figure>
  </div>
</aside>
